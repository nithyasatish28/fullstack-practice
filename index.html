<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice · Advanced Full Stack</title>
<style>
:root { --bg:#f7f7f4; --card:#ffffff; --text:#1b1d1c; --muted:#5d6461; --line:#e2e3df; --chip:#eef0eb; --accent:#2f6f57; }
@media (prefers-color-scheme: dark) { :root { --bg:#141615; --card:#1d201f; --text:#ecefed; --muted:#a3aba7; --line:#2f3432; --chip:#262a28; --accent:#6fc19c; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
main { max-width:960px; margin:0 auto; padding:36px 16px 64px; }
h1 { font-size:1.9rem; margin:0 0 6px; }
.lead { color:var(--muted); margin:0 0 26px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:16px; }
.card { display:flex; flex-direction:column; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px;
  color:inherit; text-decoration:none; transition:border-color .15s, transform .15s; }
.card:hover, .card:focus-visible { border-color:var(--accent); transform:translateY(-2px); outline:none; }
.meta { font-size:.8rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
.card h2 { font-size:1.15rem; margin:0 0 6px; }
.card p { margin:0 0 14px; color:var(--muted); }
.tags { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
.tag { font-size:.78rem; background:var(--chip); border-radius:999px; padding:2px 10px; }
.go { margin-top:auto; font-weight:700; color:var(--accent); }
.empty { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Practice</h1>
  <p class="lead">Short practice sets for the Advanced Full Stack course. Pick one to start.</p>
  <div class="grid" id="grid"></div>
</main>
<script>
// ======================================================================
// ADD A NEW PRACTICE PAGE HERE
// 1. Put the new .html file in the same folder as this index.html.
// 2. Copy one block below, paste it at the TOP of the list, and edit it.
//    The newest page should be first.
// ======================================================================
const PAGES = [
  {
    file: "warehouse-warmup-practice.html",
    title: "Warm-up · Warehouse Dispatch",
    description: "Python conditions, loops and dictionaries, and React lists, to get ready for the three Checkpoint code questions.",
    tags: ["Python", "React"],
    questions: 17,
    date: "Nov 2026",
  },
];

const grid = document.getElementById("grid");
if (PAGES.length === 0) {
  grid.innerHTML = '<p class="empty">No practice sets yet.</p>';
}
for (const page of PAGES) {
  const card = document.createElement("a");
  card.className = "card";
  card.href = page.file;

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = [page.date, page.questions ? page.questions + " questions" : ""].filter(Boolean).join(" · ");

  const title = document.createElement("h2");
  title.textContent = page.title;

  const desc = document.createElement("p");
  desc.textContent = page.description;

  const tags = document.createElement("div");
  tags.className = "tags";
  for (const t of page.tags || []) {
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = t;
    tags.appendChild(tag);
  }

  const go = document.createElement("span");
  go.className = "go";
  go.textContent = "Start →";

  card.append(meta, title, desc, tags, go);
  grid.appendChild(card);
}
</script>
</body>
</html>
